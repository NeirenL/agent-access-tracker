name: Validate data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate data/events.csv and data/agents.csv
        run: python3 .github/scripts/validate_csv.py data/events.csv data/agents.csv
