name: Update README date

on:
  push:
    branches: [main]
    paths: [data/events.csv]
  workflow_dispatch: # also allows running it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-readme-date
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set "Last updated" to today's date (UTC)
        run: |
          today=$(date -u +%Y-%m-%d)
          pattern='(\*\*Last updated:\*\* )[0-9]{4}-[0-9]{2}-[0-9]{2}'
          if ! grep -Eq "$pattern" README.md; then
            echo "::error file=README.md::Could not find a line like '**Last updated:** YYYY-MM-DD' in README.md"
            exit 1
          fi
          sed -E -i "s/$pattern/\1$today/" README.md
          echo "Last updated set to $today"

      - name: Commit and push if the date changed
        run: |
          if git diff --quiet README.md; then
            echo "README already shows today's date; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update README last updated date"
          git pull --rebase origin main
          git push origin HEAD:main
